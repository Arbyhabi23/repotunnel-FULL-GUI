name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Ambil engine hev-socks5-tunnel
        run: |
          git clone https://github.com/heiher/hev-socks5-tunnel app/src/main/jni/hev-socks5-tunnel
          cd app/src/main/jni/hev-socks5-tunnel
          git checkout 0166c4765e9e42eee7d18923026f88fda91bd9fa
          git submodule update --init --recursive
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Build debug APK
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: SimpleTunnel-apk
          path: app/build/outputs/apk/debug/app-debug.apk
